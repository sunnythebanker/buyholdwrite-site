# TEMPORARY verification workflow — Tier C item 15 (Path A).
# Purpose: run Lighthouse in the real CI runtime (ubuntu-latest has Chrome) to
# verify lighthouserc.json's 0.95 thresholds pass against the actual build,
# since this box can't run Chrome locally. NO Discord alert step (decision-#33
# safe). Triggers ONLY on this preview branch. DELETE before merging to main —
# the real gate ships later as validate.yml in the items 15+16+17+18 session.
name: Lighthouse Verify (TEMP — delete before merge)

on:
  push:
    branches: [preview/tier-c-lighthouse-config]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + build
        run: npm ci && npm run build

      - name: Serve dist locally
        run: |
          npx http-server ./dist -p 4321 -s &
          sleep 3

      - name: Lighthouse CI (lighthouserc.json, 5 URLs, 3 runs, 0.95 gates)
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          temporaryPublicStorage: true
